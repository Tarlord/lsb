name: Test

# Fake CI for the merge-queue experiment: waits a random 1–4 minutes,
# fails when a file named FAIL exists in the repository root.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Fallback for the queue bot when an updated branch got no run.
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fake test
        run: |
          secs=$(( 60 + RANDOM % 181 ))
          echo "Testing $(git rev-parse HEAD) for ${secs}s"
          sleep "$secs"
          if [ -f FAIL ]; then echo "FAIL file present"; exit 1; fi
          echo "ok"

  # Tell the merge queue a test finished on a labelled PR. Runs started by the
  # bot's built-in token do not trigger workflow_run, so Test pings it directly.
  notify-queue:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Start a merge-queue pass if this PR is queued
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          RESULT: ${{ needs.test.result }}
        run: |
          prs=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --label queue --json number --jq '.[].number')
          if [ -z "$prs" ]; then echo "No queued PR for $BRANCH"; exit 0; fi
          for n in $prs; do
            gh workflow run merge-queue.yml -R "$GITHUB_REPOSITORY" --ref master -f reason="test $RESULT on #$n"
          done

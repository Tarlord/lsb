name: Test

# Fake CI for the merge-queue experiment: waits a random 1–4 minutes,
# fails when a file named FAIL exists, or when both half-a and half-b exist.
on:
  # PR validation (on lms: source checks).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Queue validation of "master + PR" candidates (on lms: the full suite).
  push:
    branches: ['mq/**']
  # The queue bot's fallback when a candidate got no run.
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fake test
        run: |
          secs=$(( 60 + RANDOM % 181 ))
          echo "Testing $(git rev-parse HEAD) for ${secs}s"
          sleep "$secs"
          if [ -f FAIL ]; then echo "FAIL file present"; exit 1; fi
          # Passes on each PR alone, fails once both are on master + PR.
          if [ -f half-a ] && [ -f half-b ]; then echo "half-a and half-b together"; exit 1; fi
          echo "ok"

  # Start a merge-queue pass when a queue candidate finished, or when a PR that has
  # the `queue` label finished its test.
  notify-queue:
    needs: test
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Start a merge-queue pass if relevant
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          RESULT: ${{ needs.test.result }}
        run: |
          case "$BRANCH" in
            mq/*) gh workflow run merge-queue.yml -R "$GITHUB_REPOSITORY" --ref master -f reason="queue test $RESULT on ${BRANCH#mq/master/}"; exit 0 ;;
          esac
          prs=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --label queue --json number --jq '.[].number')
          if [ -z "$prs" ]; then echo "No queued PR for $BRANCH"; exit 0; fi
          for n in $prs; do
            gh workflow run merge-queue.yml -R "$GITHUB_REPOSITORY" --ref master -f reason="test $RESULT on #$n"
          done

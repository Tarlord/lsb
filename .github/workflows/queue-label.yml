name: Queue label check
run-name: "Queue label check · #${{ github.event.pull_request.number }}"

# When `queue` is added to a PR whose test already finished, start a merge-queue pass.
# While test is still running this exits: Test starts the queue when it finishes.
on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: write   # start Merge queue
  checks: read

jobs:
  check:
    if: github.event.label.name == 'queue'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start the merge queue if test has finished
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=test&filter=latest" \
            --jq '[.check_runs[]] | sort_by(.id) | last | if . == null then "none" elif .status != "completed" then "running" else .conclusion end')
          echo "test on ${SHA:0:7}: $state"
          case "$state" in
            success|failure|timed_out)
              gh workflow run merge-queue.yml -R "$GITHUB_REPOSITORY" --ref master -f reason="labeled #$PR (test $state)" ;;
            *) echo "Test has not finished; it starts the merge queue when it does." ;;
          esac

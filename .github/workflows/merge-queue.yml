name: Merge queue
run-name: "Merge queue · ${{ inputs.reason || (github.event_name == 'pull_request_target' && format('labeled #{0}', github.event.pull_request.number)) || github.event_name }}"

# A pass runs when the `queue` label is added or a Test run finishes (Test pings
# this workflow), plus a 15-minute safety net. Every pass is idempotent: state
# lives in labels, PRs and checks, so a skipped or replaced pass loses nothing.
on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this pass runs (shown as the run name)
        type: string
        default: manual
      dry_run:
        description: Log decisions without writing anything
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions:
  actions: write        # start Test after updating a branch
  checks: read
  contents: write       # update-branch and merge
  issues: write         # labels and comments
  pull-requests: write
  statuses: write       # merge-queue position status

jobs:
  tick:
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'queue'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always the trusted default branch, never PR code.
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github/merge-queue
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/merge-queue/queue.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

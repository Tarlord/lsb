name: Merge queue
run-name: "Merge queue · ${{ inputs.reason || github.event_name }}"

# Runs only when there is something to do: Test finished on a labelled PR or on a queue
# candidate, Queue label check saw a label added after the test finished, a manual run,
# or the 15-minute safety net. Every pass is idempotent: state lives in labels, PRs,
# checks and mq/* branches, so a skipped or replaced pass loses nothing.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this pass runs (shown as the run name)
        type: string
        default: manual
      dry_run:
        description: Log decisions without writing anything
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions:
  actions: write        # cancel/dispatch Test runs on candidates
  checks: read
  contents: write       # scratch refs and server-side merges
  issues: write         # labels and comments
  pull-requests: write
  statuses: write       # merge-queue status on PRs

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The deploy key (the only identity allowed to update master and mq/**) is an
    # environment secret, available to workflows running on master only.
    environment: merge-queue
    steps:
      # Always the trusted default branch, never PR code.
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github/merge-queue
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/merge-queue/queue.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MQ_DEPLOY_KEY: ${{ secrets.MQ_DEPLOY_KEY }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

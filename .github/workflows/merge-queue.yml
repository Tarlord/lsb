name: Merge queue
run-name: "Merge queue · ${{ inputs.reason || github.event_name }}"

# Runs only when a labelled PR has a finished test: started by Test (when it finishes
# on a labelled PR), by Queue label check (label added after test is green), manually,
# or by the 15-minute safety net. Every pass is idempotent: state lives in labels, PRs
# and checks, so a skipped or replaced pass loses nothing.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this pass runs (shown as the run name)
        type: string
        default: manual
      dry_run:
        description: Log decisions without writing anything
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions:
  actions: write        # start Test after updating a branch
  checks: read
  contents: write       # update-branch and merge
  issues: write         # labels and comments
  pull-requests: write
  statuses: write       # merge-queue position status

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always the trusted default branch, never PR code.
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github/merge-queue
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/merge-queue/queue.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
